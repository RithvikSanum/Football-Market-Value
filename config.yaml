# Football valuation engine — central configuration.
# All paths are relative to the project root.

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  snapshots: data/snapshots
  reports: reports
  figures: reports/figures

http:
  user_agent: "football-valuation-research/0.1 (non-commercial research project; python-requests)"
  min_delay_seconds: 1.0       # <= 1 request/sec for scraped sources
  wiki_delay_seconds: 0.3      # sequential; with a compliant UA (contact set) the limit is 200 req/min
  contact: "https://github.com/RithvikSanum/Football-Market-Value"  # project URL for the Wikimedia User-Agent (compliant UA = 200 req/min,
                               # none = 10 req/min). Left empty until the user chooses what to publish.
  timeout_seconds: 60

sources:
  transfermarkt:
    base_url: "https://pub-e682421888d945d684bcae8890b0ec20.r2.dev/data"
    archive: "transfermarkt-datasets.zip"
    tables: [appearances, club_games, clubs, competitions, countries, game_events,
             game_lineups, games, national_teams, player_valuations, players, transfers]
  wikidata:
    sparql_url: "https://query.wikidata.org/sparql"
    batch_size: 250               # TM ids per VALUES query (full P2446 scan times out)
  wikipedia:
    pageviews_url: "https://wikimedia.org/api/rest_v1/metrics/pageviews/per-article/en.wikipedia/all-access/user/{article}/daily/{start}/{end}"
    start: "20150701"             # API data starts July 2015
    end: "20260630"

training:
  min_fee_eur: 250000
  tm_value_lag_days: 30         # TM value must be dated >= this many days before transfer

splits:
  # Training window starts when appearance data begins (2012/13). Training stops at mid-2020 so
  # every season after it is out-of-sample: does the model match valuations post-2020?
  train_start: "2012-07-01"     # train: [train_start, train_end)
  train_end: "2020-07-01"
  val_end: "2021-07-01"         # validation (tuning + early stopping): 2020/21
  calib_end: "2022-07-01"       # calibration (conformal intervals): 2021/22
  # test: >= calib_end (2022/23 onward, touched once at the end)
  current_train_end: "2025-07-01"
  current_calib_end: "2026-07-01"

contract:
  # Kaggle snapshots with contract_expiration_date exist only from ~Nov 2022 (v193+), so contract
  # length enters via a separate contract-adjustment model fit on 2023+ transfers, layered on top
  # of the main pricing model (decided at checkpoint 0).
  approach: adjustment_model
  history_start: "2022-11-29"

market_index:
  # Real value = log(fee) - log(index at transfer date). See brief section 15.
  # Deflator used for the real-value target. "auto" = lowest validation MdAPE (see
  # fv.models.pricing.DEFLATORS for names). Checkpoint 1: auto picks "none" (within noise of every
  # hedonic variant); user decision = keep an index, segmented, which also removes the PL-buyer drift.
  method: "hedonic nowcast + segments"
  base_date: "2026-06-30"       # "today's money": index = 1.0 on this date
  windows:                      # window fixed effects; a transfer belongs to the window containing it
    summer: {start: "06-01", end: "09-30"}
    winter: {start: "01-01", end: "02-15"}
    # dates outside both windows are assigned to the most recent window (e.g. off-window free-agent deals)
  min_history_windows: 6        # windows needed before the rolling fit starts producing levels
  segments:
    buyer: {pl_buyer: "to_league == 'GB1'", other_buyer: "to_league != 'GB1'"}
    tier:
      top_end_quantile: 0.90    # top 10% of fees, threshold from earlier windows only
  shrinkage_pseudo_count: 50    # partial pooling: segment weight = n / (n + pseudo_count)
  repeat_sales:
    max_gap_years: 6
    controls: [age_change, minutes_share_change]
  tm_level:
    leagues: [GB1, ES1, IT1, L1, FR1]
    statistic: median
  nowcast:
    shrinkage_pseudo_count: 50  # current-window deals vs carried-forward level
    use_tm_level_movement: true

fx:
  source: ecb                   # ECB euro reference rates (Data Portal SDMX API); fallback: frankfurter
  ecb_url: "https://data-api.ecb.europa.eu/service/data/EXR/D.{cur}.EUR.SP00.A?format=csvdata"
  frankfurter_url: "https://api.frankfurter.app"
  currencies: [GBP]
  eur_to_gbp: 0.85              # fallback only for display when no dated rate applies

market_forecast:
  horizons_years: [1, 2, 3]
  revenues_csv: data/manual/league_revenues.csv
  monte_carlo:
    n_paths: 10000
    drift: auto                 # auto = historical drift only if it beats no-change in the 1y backtest
    seed: 42
  scenarios:
    base: {quantile: 0.5}
    bull: {quantile: 0.9}
    bear: {shock: largest_historical_drop}   # resolved from the index history (check 2020 COVID windows)

tuning:
  n_trials: 40                # Optuna trials per LightGBM model (expanding-window CV in train)

intervals:
  quantiles: [0.1, 0.5, 0.9]
  coverage: 0.8

current_valuation:
  as_of: "2026-06-30"         # source frozen at 2026-07-06; values are end-of-2025/26
  leagues: [GB1]                # Transfermarkt competition ids

seed: 42

forecast:                       # phase 3: 12-month value forecast (brief section 7)
  min_value_eur: 1000000        # snapshot panel: players valued >= this at a core-league club
  snapshot_months: [1, 7]       # 1 Jan / 1 Jul
  # snapshot-date splits: the 12-month target must be realised before the next split starts
  train_last: "2019-07-01"      # targets realised by 2020-07-01 (= pricing train_end)
  val_dates: ["2020-01-01", "2020-07-01"]
  calib_dates: ["2021-01-01", "2021-07-01", "2022-01-01"]
  test_first: "2022-07-01"      # test snapshots 2022-07 .. 2025-07 (scored once)
  signal_top_quantile: 0.9      # undervalued flag: model / TM ratio in the top decile per date
